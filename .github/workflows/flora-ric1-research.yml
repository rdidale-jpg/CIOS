name: FLORA RIC-1 evidence acceptance QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/flora-runtime/ric1/**'
      - 'tools/research/ric1_validation.py'
      - 'tests/test_flora_ric1_research_acceptance.py'
      - '.github/workflows/flora-ric1-research.yml'
permissions:
  contents: read
jobs:
  research-acceptance-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact immutable research and design inputs
        run: |
          git cat-file -e c57ed9728473563b5535db36d5bfbe5e96a8c572^{commit}
          git cat-file -e 71d34bb50cff4a7e99cf49f53a0ee5c8724c3df5^{commit}
          git cat-file -e 85317167b4001dc027216c1c4e2faf058f0631a3^{commit}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check provenance, scope, dates, financial reconciliation, negative and ACL cases
        run: python -m pytest tests/test_flora_ric1_research_acceptance.py -q
      - name: Report acceptance limits without source or production writes
        run: python tools/research/ric1_validation.py
