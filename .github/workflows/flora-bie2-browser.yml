name: FLORA BIE-2 source-bound banking runtime proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'cios/applications/flora/**'
      - 'enterprise-knowledge/banking/research-model/**'
      - 'docs/flora-runtime/bie2/**'
      - 'tests/test_flora_bie2_635.py'
      - 'tools/research/bie2_quality.py'
      - 'tools/ci/flora_bie2_preview.cjs'
      - 'tools/ci/flora_vp2_preview.py'
      - '.github/workflows/flora-bie2-browser.yml'
permissions:
  contents: read
jobs:
  research-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tools/research/bie2_quality.py
      - run: python -m pytest tests/test_flora_bie2_635.py -q
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/flora-vp2-browser playwright@1.62.1
          /tmp/flora-vp2-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: git worktree add --detach /tmp/flora-bie2-before b5b05f841bc6f17f5ffe3286a65e8745e7c79ec3
      - name: Actual runtime, original main comparison and responsive interactions
        env:
          NODE_PATH: /tmp/flora-vp2-browser/node_modules
        run: python tools/ci/flora_vp2_preview.py --scenario bie2 --output /tmp/flora-bie2-previews --baseline-root /tmp/flora-bie2-before
      - uses: actions/upload-artifact@v4
        with:
          name: flora-bie2-runtime-previews-${{ github.event.pull_request.head.sha }}
          path: /tmp/flora-bie2-previews/
          retention-days: 14
