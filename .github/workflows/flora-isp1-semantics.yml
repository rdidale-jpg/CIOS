name: FLORA ISP-1 intelligence semantics
on:
  pull_request:
    branches: [main]
    paths:
      - 'cios/applications/flora/intelligence_presentation.py'
      - 'cios/applications/flora/visual_streams.py'
      - 'cios/applications/flora/visual_v2.py'
      - 'cios/applications/flora/public_routes.py'
      - 'cios/applications/flora/security_web.py'
      - 'tests/test_flora_intelligence_presentation_623.py'
      - 'docs/flora-runtime/isp1-623/**'
      - '.github/workflows/flora-isp1-semantics.yml'
permissions:
  contents: read
jobs:
  semantic-and-access-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test semantics, current views, source integrity, owner access and artwork
        run: python -m pytest tests/test_flora_intelligence_presentation_623.py tests/test_flora_visual_streams_612.py tests/test_flora_visual_v2_583.py tests/test_flora_research_intelligence.py tests/test_flora_design_system_585.py -q
