name: FLORA EAI-2 intelligence semantics and controlled integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'cios/applications/flora/intelligence_presentation.py'
      - 'cios/applications/flora/leadership_agenda.py'
      - 'cios/applications/flora/visual_stream_assets/**'
      - 'enterprise-knowledge/banking/research-model/**'
      - 'enterprise-knowledge/macro/research-model/**'
      - 'cios/applications/flora/visual_streams.py'
      - 'cios/applications/flora/visual_v2.py'
      - 'cios/applications/flora/public_routes.py'
      - 'cios/applications/flora/security_web.py'
      - 'tests/test_flora_intelligence_presentation_623.py'
      - 'tests/test_flora_controlled_integration_625.py'
      - 'tests/test_flora_visual_panels_632.py'
      - 'tests/test_flora_evidence_expansion_628.py'
      - 'tests/test_flora_eai2_integration.py'
      - 'tests/test_flora_bie2_635.py'
      - 'tests/test_flora_bie3_637.py'
      - 'docs/flora-runtime/bie3/**'
      - 'tools/research/bie3_quality.py'
      - 'docs/flora-runtime/bie2/**'
      - 'tools/research/bie2_quality.py'
      - 'cios/applications/flora/visual_panels.py'
      - 'docs/flora-runtime/vp2-632/**'
      - 'docs/flora-runtime/eai1-628/**'
      - 'docs/flora-runtime/eai2/**'
      - 'architecture/decisions/ADR-027*'
      - 'tests/test_flora_primary_enrichment.py'
      - 'tools/research/history_integrity.py'
      - 'docs/flora-runtime/isp1-623/**'
      - 'docs/flora-runtime/int1-625/**'
      - '.github/workflows/flora-isp1-semantics.yml'
permissions:
  contents: read
jobs:
  semantic-and-access-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test semantics, current views, source integrity, owner access and artwork
        run: python -m pytest tests/test_flora_bie3_637.py tests/test_flora_bie2_635.py tests/test_flora_eai2_integration.py tests/test_flora_evidence_expansion_628.py tests/test_flora_visual_panels_632.py tests/test_flora_controlled_integration_625.py tests/test_flora_intelligence_presentation_623.py tests/test_flora_visual_streams_612.py tests/test_flora_visual_v2_583.py tests/test_flora_research_intelligence.py tests/test_flora_design_system_585.py tests/test_flora_primary_enrichment.py tests/test_flora_unified_integration.py::test_both_reviewed_workstreams_remain_ancestors_with_exact_source_cuts tests/test_flora_unified_integration.py::test_history_guard_rejects_every_unapproved_change tests/test_flora_commercial_visual_v3.py::test_no_existing_research_history_or_source_identity_is_changed -q
