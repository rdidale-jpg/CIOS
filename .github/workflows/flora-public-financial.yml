name: FLORA public factual intelligence
on:
  pull_request:
    branches: [main]
    paths:
      - 'cios/applications/flora/research_intelligence/source_import.py'
      - 'cios/applications/flora/financial_intelligence/candidate_analytics.py'
      - 'cios/applications/flora/lloyds_recovery.py'
      - 'enterprise-knowledge/banking/research-model/source-snapshots/PFI-Lloyds-Q326.json'
      - 'tests/test_flora_public_financial.py'
      - 'tools/research/public_financial*.py'
      - 'tools/ci/flora_public_financial_preview.cjs'
      - 'docs/flora-runtime/public-financial-intelligence/**'
      - '.github/workflows/flora-public-financial.yml'
permissions:
  contents: read
jobs:
  public-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Ordinary factual method, applicable restrictions, financial and tenant boundaries
        run: python -m pytest tests/test_flora_public_financial.py tests/test_flora_f1_642.py tests/test_flora_f2_644.py tests/test_flora_f3_646.py tests/test_flora_rud1_648.py tests/test_flora_auth2_655.py -q
      - name: Preserve all historical owner cuts, private-run functions and original artwork
        run: python tools/research/auth2_compatibility.py > "$RUNNER_TEMP/public-financial-compatibility.json"
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/public-financial-node" playwright@1.62.1
          "$RUNNER_TEMP/public-financial-node/node_modules/.bin/playwright" install --with-deps chromium
      - name: Shipping factual analysis and isolated restriction/withdrawal responsive proof
        env:
          NODE_PATH: ${{ runner.temp }}/public-financial-node/node_modules
        run: python tools/research/public_financial_preview.py --output "$RUNNER_TEMP/public-financial-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flora-public-financial-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/public-financial-compatibility.json
            ${{ runner.temp }}/public-financial-proof/Proof.json
            ${{ runner.temp }}/public-financial-proof/Browser-Checks.json
            ${{ runner.temp }}/public-financial-proof/*.jpg
          retention-days: 14
