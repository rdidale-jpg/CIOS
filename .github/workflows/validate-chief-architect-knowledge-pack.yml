name: Validate Chief Architect Knowledge Pack

on:
  pull_request:
    paths:
      - "architecture/handbook/CIOS-Chief-Architect-Handbook.md"
      - "knowledge-packs/chief-architect/CURRENT-PROGRAMME-STATE.md"
      - "knowledge-packs/chief-architect/operating-guidance/Chief-Architect-Operating-Guidance.md"
      - "knowledge-packs/chief-architect/templates/Architecture-Decision-Review-Template.md"
      - "knowledge-packs/chief-architect/source-map.yaml"
      - "architecture/founding-papers/FP-010-Knowledge-Pack-Architecture.md"
      - "architecture/founding-papers/FP-012-Enterprise-Reinvention-Intelligence.md"
      - "architecture/founding-papers/FP-009-Hypothesis-Validation-Standard.md"
      - "architecture/decisions/ADR-016-Knowledge-Packs-as-Standard-Exchange-Mechanism.md"
      - "architecture/decisions/ADR-014-Evidence-Governed-Enterprise-Intelligence-Reasoning-Runtime.md"
      - "architecture/decisions/ADR-024-Hybrid-Enterprise-Intelligence-Runtime.md"
      - "docs/flora-runtime/wp-011/Flora-Runtime-Capability-Baseline.md"
      - "architecture/specifications/flora/FEIR-001-Flora-Enterprise-Intelligence-Runtime-Architecture-v1.0.md"
      - "architecture/specifications/flora/EIRP-001-Enterprise-Intelligence-Reasoning-Pipeline-Specification.md"
      - "architecture/enterprise-intelligence/volume-1-enterprise-modelling/EI-001-Enterprise-Model-Specification.md"
      - "architecture/enterprise-intelligence/volume-1-enterprise-modelling/EI-002-Enterprise-Knowledge-Graph.md"
      - "architecture/enterprise-intelligence/volume-1-enterprise-modelling/EI-003-Enterprise-Behaviour-Model.md"
      - "architecture/enterprise-intelligence/volume-5-intelligence-foundations/EI-012-Enterprise-Observation-Model.md"
      - "architecture/enterprise-intelligence/volume-2-commercial-intelligence/EI-004-Commercial-Reasoning-Framework.md"
      - "architecture/reference-architecture/standards/EIF-001-Enterprise-Intelligence-Foundation-Model.md"
      - "architecture/specifications/knowledge-packs/Knowledge-Pack-Specification-v1.0.md"
      - "architecture/reference-architecture/CIOS-Reference-Architecture-v1.0.md"
      - "architecture/reference-architecture/Architecture-Principles.md"
      - "architecture/roadmap/Flora-Roadmap.md"
      - "knowledge-packs/chief-architect/**"
      - "tests/knowledge_packs/test_chief_architect_pack.py"
      - "tools/knowledge-packs/build_pack.py"
      - ".github/workflows/validate-chief-architect-knowledge-pack.yml"
  push:
    branches:
      - main
      - work
    paths:
      - "architecture/handbook/CIOS-Chief-Architect-Handbook.md"
      - "knowledge-packs/chief-architect/CURRENT-PROGRAMME-STATE.md"
      - "knowledge-packs/chief-architect/operating-guidance/Chief-Architect-Operating-Guidance.md"
      - "knowledge-packs/chief-architect/templates/Architecture-Decision-Review-Template.md"
      - "knowledge-packs/chief-architect/source-map.yaml"
      - "architecture/founding-papers/FP-010-Knowledge-Pack-Architecture.md"
      - "architecture/founding-papers/FP-012-Enterprise-Reinvention-Intelligence.md"
      - "architecture/founding-papers/FP-009-Hypothesis-Validation-Standard.md"
      - "architecture/decisions/ADR-016-Knowledge-Packs-as-Standard-Exchange-Mechanism.md"
      - "architecture/decisions/ADR-014-Evidence-Governed-Enterprise-Intelligence-Reasoning-Runtime.md"
      - "architecture/decisions/ADR-024-Hybrid-Enterprise-Intelligence-Runtime.md"
      - "docs/flora-runtime/wp-011/Flora-Runtime-Capability-Baseline.md"
      - "architecture/specifications/flora/FEIR-001-Flora-Enterprise-Intelligence-Runtime-Architecture-v1.0.md"
      - "architecture/specifications/flora/EIRP-001-Enterprise-Intelligence-Reasoning-Pipeline-Specification.md"
      - "architecture/enterprise-intelligence/volume-1-enterprise-modelling/EI-001-Enterprise-Model-Specification.md"
      - "architecture/enterprise-intelligence/volume-1-enterprise-modelling/EI-002-Enterprise-Knowledge-Graph.md"
      - "architecture/enterprise-intelligence/volume-1-enterprise-modelling/EI-003-Enterprise-Behaviour-Model.md"
      - "architecture/enterprise-intelligence/volume-5-intelligence-foundations/EI-012-Enterprise-Observation-Model.md"
      - "architecture/enterprise-intelligence/volume-2-commercial-intelligence/EI-004-Commercial-Reasoning-Framework.md"
      - "architecture/reference-architecture/standards/EIF-001-Enterprise-Intelligence-Foundation-Model.md"
      - "architecture/specifications/knowledge-packs/Knowledge-Pack-Specification-v1.0.md"
      - "architecture/reference-architecture/CIOS-Reference-Architecture-v1.0.md"
      - "architecture/reference-architecture/Architecture-Principles.md"
      - "architecture/roadmap/Flora-Roadmap.md"
      - "knowledge-packs/chief-architect/**"
      - "tests/knowledge_packs/test_chief_architect_pack.py"
      - "tools/knowledge-packs/build_pack.py"
      - ".github/workflows/validate-chief-architect-knowledge-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Chief Architect Knowledge Pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0"

      - name: Resolve Knowledge Pack version
        run: |
          PACK_VERSION="$(tr -d '[:space:]' < knowledge-packs/chief-architect/VERSION)"
          if [[ ! "$PACK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Chief Architect Knowledge Pack semantic version: $PACK_VERSION" >&2
            exit 1
          fi
          echo "PACK_VERSION=$PACK_VERSION" >> "$GITHUB_ENV"
          echo "PACK_BASENAME=CIOS-Chief-Architect-Knowledge-Pack-v$PACK_VERSION" >> "$GITHUB_ENV"

      - name: Run Chief Architect Knowledge Pack tests
        run: |
          pytest tests/knowledge_packs/test_chief_architect_pack.py

      - name: Build Chief Architect Knowledge Pack
        run: |
          python3 tools/knowledge-packs/build_pack.py --profile chief-architect

      - name: Verify output and checksum
        run: |
          ZIP="dist/${PACK_BASENAME}.zip"
          REPORT="dist/${PACK_BASENAME}-build-report.md"
          CHECKSUM="dist/${PACK_BASENAME}.sha256"

          test -f "$ZIP"
          test -f "$REPORT"
          (cd dist && sha256sum --check "$(basename "$CHECKSUM")")

      - name: Upload validation artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACK_BASENAME }}
          path: |
            dist/${{ env.PACK_BASENAME }}.zip
            dist/${{ env.PACK_BASENAME }}.sha256
            dist/${{ env.PACK_BASENAME }}-build-report.md
            dist/${{ env.PACK_BASENAME }}-validation-report.md
            dist/${{ env.PACK_BASENAME }}-architecture-delta.md
            dist/${{ env.PACK_BASENAME }}-governance-classification-report.md
            dist/${{ env.PACK_BASENAME }}-supersession-report.md
            dist/${{ env.PACK_BASENAME }}-runtime-capability-delta.md
            dist/${{ env.PACK_BASENAME }}-programme-state-delta.md
            dist/${{ env.PACK_BASENAME }}-migration-note.md
            dist/${{ env.PACK_BASENAME }}-excluded-source-list.md
            dist/${{ env.PACK_BASENAME }}-unresolved-conflict-list.md
          if-no-files-found: error
