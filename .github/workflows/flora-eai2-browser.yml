name: FLORA EAI-2 VP-2 integration browser proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'cios/applications/flora/**'
      - 'tools/ci/flora_vp2_preview.*'
      - 'tools/ci/flora_eai2_preview.cjs'
      - 'enterprise-knowledge/banking/research-model/**'
      - 'enterprise-knowledge/macro/research-model/**'
      - 'tests/test_flora_eai2_integration.py'
      - 'docs/flora-runtime/eai2/**'
      - '.github/workflows/flora-eai2-browser.yml'
permissions:
  contents: read
jobs:
  runtime-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/flora-vp2-browser playwright@1.62.1
          /tmp/flora-vp2-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Retain exact validated main for the before comparison
        run: git worktree add --detach /tmp/flora-eai2-before ce4314c3528d5f4beae6e0e4fa53209ddb56ff5c
      - name: Actual application journey, source/account boundaries and responsive proof
        env:
          NODE_PATH: /tmp/flora-vp2-browser/node_modules
        run: python tools/ci/flora_vp2_preview.py --scenario eai2 --output /tmp/flora-eai2-previews --baseline-root /tmp/flora-eai2-before
      - uses: actions/upload-artifact@v4
        with:
          name: flora-eai2-runtime-previews-${{ github.event.pull_request.head.sha }}
          path: /tmp/flora-eai2-previews/
          retention-days: 14
