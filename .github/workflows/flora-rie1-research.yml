name: FLORA RIE-1 research integrity
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/flora-runtime/rie1-617/**'
      - 'tools/research/rie1_617_validation.py'
      - 'tests/test_flora_rie1_research_pack.py'
      - '.github/workflows/flora-rie1-research.yml'
permissions:
  contents: read
jobs:
  research-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check source integrity, financial bridges, negative cases and isolated existing import contracts
        run: python -m pytest tests/test_flora_rie1_research_pack.py -q
      - name: Report proposal counts without claiming research completeness
        run: python tools/research/rie1_617_validation.py
