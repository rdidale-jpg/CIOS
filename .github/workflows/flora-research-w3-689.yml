name: FLORA Wave 3 research QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/flora-runtime/research-enrich-all-w3-689/**'
      - 'tests/test_flora_research_enrich_all_w3_689.py'
      - '.github/workflows/flora-research-w3-689.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python docs/flora-runtime/research-enrich-all-w3-689/validate.py
      - run: python -m pytest tests/test_flora_research_enrich_all_w3_689.py -q
