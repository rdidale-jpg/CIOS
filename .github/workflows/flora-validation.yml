name: FLORA validation

on:
  pull_request:
    branches: [main, codex/flora-security-repair-01a, codex/flora-security-repair-01b, codex/flora-living-industry-maps-v2, codex/flora-commercial-visual-intelligence-v3]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - 'cios/applications/flora/**'
      - 'enterprise-knowledge/banking/**'
      - 'enterprise-knowledge/aviation/**'
      - 'tests/**'
      - 'tools/ci/**'
      - 'tools/import_flora_primary_source.py'
      - 'tools/research/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'docs/flora-runtime/security-repair-01*/**'
      - 'docs/flora-runtime/experience-repair-02/run_regressions.py'
      - '.github/workflows/flora-validation.yml'
  push:
    branches: [main]
    paths:
      - 'cios/applications/flora/**'
      - 'enterprise-knowledge/banking/**'
      - 'enterprise-knowledge/aviation/**'
      - 'tests/**'
      - 'tools/ci/**'
      - 'tools/import_flora_primary_source.py'
      - 'tools/research/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'docs/flora-runtime/security-repair-01*/**'
      - 'docs/flora-runtime/experience-repair-02/run_regressions.py'
      - '.github/workflows/flora-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flora-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: FLORA security and regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Test CI gate failure behaviour
        run: python -m unittest discover -s tests/ci -v
      - name: Run strict security and versioned regression comparison
        id: validation
        run: python tools/ci/flora_ci.py --output "$RUNNER_TEMP/flora-ci"
      - name: Publish sanitized job summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/flora-ci/artifacts/summary.md"; then
            cat "$RUNNER_TEMP/flora-ci/artifacts/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain sanitized test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flora-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flora-ci/artifacts/
          if-no-files-found: error
          retention-days: 7
