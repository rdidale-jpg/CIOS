name: FLORA validation

on:
  pull_request:
    branches: [main, codex/flora-integration-578, codex/flora-security-repair-01a, codex/flora-security-repair-01b, codex/flora-living-industry-maps-v2, codex/flora-commercial-visual-intelligence-v3, codex/flora-global-macro-intelligence-v1, codex/flora-intelligence-depth-v1, codex/flora-uk-technology-visual-foundation-v1, codex/flora-technology-visual-world-v1]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - 'cios/applications/flora/**'
      - 'enterprise-knowledge/banking/**'
      - 'enterprise-knowledge/aviation/**'
      - 'enterprise-knowledge/macro/**'
      - 'tests/**'
      - 'tools/ci/**'
      - 'tools/import_flora_primary_source.py'
      - 'tools/research/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'docs/flora-runtime/security-repair-01*/**'
      - 'docs/flora-runtime/technology-visual-foundation/**'
      - 'docs/flora-runtime/technology-visual-world-v1/**'
      - 'docs/flora-runtime/technology-owner-journey/**'
      - 'docs/flora-runtime/offers-v1-576/**'
      - 'docs/flora-runtime/ux-refinement-573/**'
      - 'docs/flora-runtime/integration-578/**'
      - 'docs/flora-runtime/home-v1-579/**'
      - 'docs/flora-runtime/experience-repair-02/run_regressions.py'
      - '.github/workflows/flora-validation.yml'
      - '.github/workflows/flora-release-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'cios/applications/flora/**'
      - 'enterprise-knowledge/banking/**'
      - 'enterprise-knowledge/aviation/**'
      - 'enterprise-knowledge/macro/**'
      - 'tests/**'
      - 'tools/ci/**'
      - 'tools/import_flora_primary_source.py'
      - 'tools/research/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'docs/flora-runtime/security-repair-01*/**'
      - 'docs/flora-runtime/technology-visual-foundation/**'
      - 'docs/flora-runtime/technology-visual-world-v1/**'
      - 'docs/flora-runtime/technology-owner-journey/**'
      - 'docs/flora-runtime/offers-v1-576/**'
      - 'docs/flora-runtime/ux-refinement-573/**'
      - 'docs/flora-runtime/integration-578/**'
      - 'docs/flora-runtime/home-v1-579/**'
      - 'docs/flora-runtime/experience-repair-02/run_regressions.py'
      - '.github/workflows/flora-validation.yml'
      - '.github/workflows/flora-release-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flora-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: FLORA security and regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Test CI gate failure behaviour
        run: python -m unittest discover -s tests/ci -v
      - name: Run strict security and versioned regression comparison
        id: validation
        run: python tools/ci/flora_ci.py --output "$RUNNER_TEMP/flora-ci"
      - name: Test approved Technology owner journey
        run: python -m pytest tests/test_flora_technology_owner_journey.py tests/test_flora_ux_refinement_573.py tests/test_flora_integration_578.py -q
      - name: Test controlled Offers pilot
        run: python -m pytest tests/test_flora_offers_v1.py -q
      - name: Test separate Home v1 design preview
        run: python -m pytest tests/test_flora_home_v1_579.py -q
      - name: Publish sanitized job summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/flora-ci/artifacts/summary.md"; then
            cat "$RUNNER_TEMP/flora-ci/artifacts/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain sanitized test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flora-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flora-ci/artifacts/
          if-no-files-found: error
          retention-days: 7
