name: FLORA F2 financial analyst workspace
on:
  pull_request:
    branches: [main]
    paths:
      - 'cios/applications/flora/**'
      - 'enterprise-knowledge/banking/research-model/**'
      - 'tests/test_flora_f2_644.py'
      - 'tests/fixtures/financial_analyst.py'
      - 'tests/flora_f2_owner_contract.py'
      - 'tools/research/f2_proof.py'
      - 'tools/ci/flora_f2_preview.cjs'
      - 'docs/flora-runtime/f2-644/**'
      - '.github/workflows/flora-f2-644.yml'
permissions:
  contents: read
jobs:
  candidate-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Typed meaning, actual run reload, source-use withdrawal and real access boundaries
        run: python -m pytest tests/test_flora_f2_644.py tests/test_flora_f1_642.py -q
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/f2-node" playwright@1.62.1
          "$RUNNER_TEMP/f2-node/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real-source proof and responsive application checks
        env:
          NODE_PATH: ${{ runner.temp }}/f2-node/node_modules
        run: |
          git worktree add --detach "$RUNNER_TEMP/f2-before" 98fcab91aa94180b11c41c60f4cf7e4d4ad39e40
          python tools/research/f2_proof.py --output "$RUNNER_TEMP/f2-proof" --preview --baseline-root "$RUNNER_TEMP/f2-before"
      - name: Preserve complete accepted visual browser journey
        env:
          NODE_PATH: ${{ runner.temp }}/f2-node/node_modules
        run: python tools/ci/flora_vp2_preview.py --output "$RUNNER_TEMP/f2-visual-regression"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flora-f2-proof-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/f2-proof/Proof.json
            ${{ runner.temp }}/f2-proof/Browser-Checks.json
            ${{ runner.temp }}/f2-proof/*.jpg
            ${{ runner.temp }}/f2-proof/Accessibility.yml
            ${{ runner.temp }}/f2-visual-regression/Browser-Checks.json
            ${{ runner.temp }}/f2-visual-regression/Performance.json
          retention-days: 14
