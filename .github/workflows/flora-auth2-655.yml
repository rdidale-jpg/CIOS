name: FLORA AUTH-2 public intelligence and managed identity
on:
  pull_request:
    branches: [main]
    paths:
      - 'cios/applications/flora/**'
      - 'tests/**'
      - 'tools/research/auth2*.py'
      - 'tools/ci/flora_auth2_preview.cjs'
      - 'docs/flora-runtime/auth2-655/**'
      - 'requirements.txt'
      - '.github/workflows/flora-auth2-655.yml'
permissions:
  contents: read
jobs:
  identity-and-public-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Provider, explicit identity binding, CIOS permissions and public Source projection
        run: python -m pytest tests/test_flora_auth2_655.py tests/test_flora_auth1_652.py tests/test_flora_uxr1_650.py -q
      - name: Individually pinned owner evolution and unchanged source/security/artwork history
        run: python tools/research/auth2_compatibility.py > "$RUNNER_TEMP/auth2-quality.json"
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/auth2-node" playwright@1.62.1
          "$RUNNER_TEMP/auth2-node/node_modules/.bin/playwright" install --with-deps chromium
      - name: HTTPS public and private journeys with explicitly isolated provider double
        env:
          NODE_PATH: ${{ runner.temp }}/auth2-node/node_modules
        run: |
          git worktree add --detach "$RUNNER_TEMP/auth2-before" 7b056b21cd5d824bc4359b4e1ed49a1673a7f5fc
          python tools/research/auth2_proof.py --output "$RUNNER_TEMP/auth2-proof" --baseline-root "$RUNNER_TEMP/auth2-before"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flora-auth2-proof-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/auth2-quality.json
            ${{ runner.temp }}/auth2-proof/Proof.json
            ${{ runner.temp }}/auth2-proof/Browser-Checks.json
            ${{ runner.temp }}/auth2-proof/*.jpg
          retention-days: 14
