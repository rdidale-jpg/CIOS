name: FLORA Enterprise Economics A1
on:
  pull_request:
    branches: [main]
    paths:
      - 'cios/applications/flora/**'
      - 'tests/**'
      - 'tools/research/**'
      - 'tools/ci/flora_enterprise_economics_preview.cjs'
      - 'docs/flora-runtime/enterprise-economics-a1/**'
      - 'docs/flora-runtime/accepted-ux-recovery/**'
      - 'docs/flora-runtime/living-enterprise-preview/**'
      - 'docs/flora-runtime/lloyds-gold-standard/**'
      - 'docs/flora-runtime/enterprise-gold-reconciliation/**'
      - 'docs/flora-runtime/lloyds-gold-v2/**'
      - 'docs/flora-runtime/lloyds-experience-completion/**'
      - 'docs/flora-runtime/lloyds-gold-v3/**'
      - 'docs/flora-runtime/lloyds-ceo-intelligence/**'
      - '.github/workflows/flora-enterprise-economics-a1.yml'
permissions:
  contents: read
jobs:
  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Economics, source withdrawal, financial and existing journey boundaries
        run: python -m pytest tests/test_flora_accepted_ux_recovery.py tests/test_flora_ux_unify_670.py tests/test_flora_banking_cohort_691.py tests/test_flora_uxr1_650.py tests/test_flora_lloyds_flagship.py tests/test_flora_technology_alignment.py tests/test_flora_eei3.py tests/test_flora_eei2b.py tests/test_flora_eei2a.py tests/test_flora_enterprise_economics_a1.py tests/test_flora_experience_684.py tests/test_flora_public_financial.py tests/test_flora_et_integrate_672.py tests/test_flora_f1_642.py tests/test_flora_f2_644.py tests/test_flora_f3_646.py tests/test_flora_rud1_648.py tests/test_flora_auth2_655.py tests/test_flora_visual_panels_632.py -q
      - name: All strict security tests
        run: python -m pytest tests/test_flora_security*.py -q
      - name: Optional Living Enterprise preview and fail-closed public source boundaries
        run: python -m pytest tests/test_flora_living_enterprise_preview.py tests/test_flora_lloyds_gold.py tests/test_flora_lloyds_ceo.py tests/test_flora_main_canvas.py tests/test_flora_lloyds_activation.py tests/test_flora_lloyds_service_workload.py tests/test_flora_gold_reconciliation.py tests/test_flora_lloyds_gold_v2.py tests/test_flora_lloyds_experience_completion.py tests/test_flora_lloyds_gold_v3.py tests/test_flora_lloyds_ceo_intelligence.py tests/test_flora_lloyds_financials.py -q
      - name: Lloyds intelligence utilisation and immutable image verification
        run: |
          git worktree add --detach "$RUNNER_TEMP/gold-approved-cut" 1c13e6962516dbb071b2133f2c1a3de87647e2ac
          cd "$RUNNER_TEMP/gold-approved-cut"
          python docs/flora-runtime/lloyds-gold-standard/audit.py --check
      - name: Verify the A1 historical cut and its reverse-tree rollback
        run: |
          # The A1 exact-cut audit includes source paths that later PRs may
          # legitimately evolve. Current-head runtime tests run above and below.
          a1_merge=088275e75365f1f251537d21e2601f10aa8e861a
          if git merge-base --is-ancestor "$a1_merge" HEAD; then
            git worktree add --detach "$RUNNER_TEMP/economics-a1-cut" "$a1_merge"
            cd "$RUNNER_TEMP/economics-a1-cut"
          fi
          python tools/research/enterprise_economics_quality.py > "$RUNNER_TEMP/economics-quality.json"
      - name: Install isolated Chromium
        run: |
          python -m pip install playwright==1.62.0
          npm install --prefix "$RUNNER_TEMP/economics-node" playwright@1.62.1
          "$RUNNER_TEMP/economics-node/node_modules/.bin/playwright" install --with-deps chromium
          python -m playwright install chromium
      - name: Desktop, iPads, mobile, keyboard, touch, print and history withdrawal
        env:
          NODE_PATH: ${{ runner.temp }}/economics-node/node_modules
        run: |
          python tools/research/enterprise_economics_preview.py --output "$RUNNER_TEMP/economics-browser"
          python docs/flora-runtime/accepted-ux-recovery/browser.py "$RUNNER_TEMP/economics-browser" after
      - name: Optional preview, unchanged default and withdrawal through actual browser history
        run: |
          git worktree add --detach "$RUNNER_TEMP/living-preview-baseline" 97d316c640c96d99c2301819f8aac00b3b9c1398
          cd "$RUNNER_TEMP/living-preview-baseline"
          python "$GITHUB_WORKSPACE/docs/flora-runtime/living-enterprise-preview/browser.py" "$RUNNER_TEMP/living-preview-browser" before
          cd "$GITHUB_WORKSPACE"
          python docs/flora-runtime/living-enterprise-preview/browser.py "$RUNNER_TEMP/living-preview-browser" after
      - name: Gold Standard actual runtime, preserved previews, touch, history and withdrawal
        run: |
          git worktree add --detach "$RUNNER_TEMP/gold-baseline" eaca26f2b31c3c9227bb797d60f7d3492a8313d1
          cd "$RUNNER_TEMP/gold-baseline"
          python "$GITHUB_WORKSPACE/docs/flora-runtime/lloyds-gold-standard/browser.py" "$RUNNER_TEMP/gold-browser" before
          cd "$GITHUB_WORKSPACE"
          python docs/flora-runtime/lloyds-gold-standard/browser.py "$RUNNER_TEMP/gold-browser" after
      - name: Gold scope, source inventory, capture hashes and reverse-tree rollback
        run: |
          cd "$RUNNER_TEMP/gold-approved-cut"
          python docs/flora-runtime/lloyds-gold-standard/validate.py
      - name: CEO current-head default, predecessor, responsive, source and rollback proof
        run: |
          cd "$RUNNER_TEMP/gold-approved-cut"
          python "$GITHUB_WORKSPACE/docs/product/flora-experience/lloyds-ceo/browser.py" before "$RUNNER_TEMP/ceo-browser"
          cd "$GITHUB_WORKSPACE"
          python docs/product/flora-experience/lloyds-ceo/browser.py after "$RUNNER_TEMP/ceo-browser"
          # The CEO exact-scope/capture audit remains an immutable historical cut.
          git worktree add --detach "$RUNNER_TEMP/ceo-approved-cut" cc8d93fe7183fdd86fd4c4e81907a2a0764227a5
          cd "$RUNNER_TEMP/ceo-approved-cut"
          python docs/product/flora-experience/lloyds-ceo/validate.py
          python "$GITHUB_WORKSPACE/docs/product/flora-experience/main-canvas/browser.py" before "$RUNNER_TEMP/canvas-browser"
          cd "$GITHUB_WORKSPACE"
          python docs/product/flora-experience/main-canvas/browser.py after "$RUNNER_TEMP/canvas-browser"
          python docs/research/lloyds-intelligence-recovery/check_canvas_browser.py "$RUNNER_TEMP/canvas-browser"
          # Keep the original #733 scope/hash/rollback audit on its approved cut.
          git worktree add --detach "$RUNNER_TEMP/canvas-approved-cut" 3a4c7e0f6ad81af7ef32ed477a1a584ac2efae87
          cd "$RUNNER_TEMP/canvas-approved-cut"
          python docs/product/flora-experience/main-canvas/validate.py
      - name: Lloyds subject exploration, responsive interaction and live withdrawal
        run: python docs/flora-runtime/lloyds-activation/browser.py after "$RUNNER_TEMP/lloyds-activation-browser"
      - name: Source-bound Lloyds product knowledge, navigation and withdrawal
        run: python docs/flora-runtime/lloyds-substantive-intelligence/browser.py "$RUNNER_TEMP/lloyds-product-browser" after
      - name: Gold reconciliation, primary homes, contextual navigation and withdrawal
        run: python docs/flora-runtime/enterprise-gold-reconciliation/browser.py "$RUNNER_TEMP/gold-reconciliation-browser" after
      - name: Gold v2 enterprise knowledge, four responsive sizes and lifecycle
        run: python docs/flora-runtime/lloyds-gold-v2/browser.py "$RUNNER_TEMP/gold-v2-browser" after
      - name: Integrated enterprise experience, responsive geometry and withdrawal
        run: |
          git worktree add --detach "$RUNNER_TEMP/experience-completion-cut" 08763fca342fcaf67c37f261948d8a8c9642d2c3
          (cd "$RUNNER_TEMP/experience-completion-cut" && python docs/flora-runtime/lloyds-experience-completion/validate.py) > "$RUNNER_TEMP/experience-scope.json"
          python docs/flora-runtime/lloyds-experience-completion/browser.py "$RUNNER_TEMP/experience-completion-browser" after
      - name: Connected v3 enterprise topics and original-owner preservation
        run: |
          git worktree add --detach "$RUNNER_TEMP/gold-v3-cut" 201fe851a531ecb854d3ba8e3416bc667ab8c860
          (cd "$RUNNER_TEMP/gold-v3-cut" && python docs/flora-runtime/lloyds-gold-v3/validate.py) > "$RUNNER_TEMP/v3-scope.json"
          python docs/flora-runtime/lloyds-gold-v3/browser.py "$RUNNER_TEMP/v3-browser" after
      - name: CEO source-grounded intelligence, responsive journeys and withdrawal
        run: |
          git worktree add --detach "$RUNNER_TEMP/ceo-intelligence-cut" 3038fd18a249485471ba3cab4f4a12989d509c40
          (cd "$RUNNER_TEMP/ceo-intelligence-cut" && python docs/flora-runtime/lloyds-ceo-intelligence/validate.py) > "$RUNNER_TEMP/ceo-intelligence-scope.json"
          python docs/flora-runtime/lloyds-ceo-intelligence/browser.py "$RUNNER_TEMP/ceo-intelligence-browser" after
      - name: Lloyds reported financial charts and evidence interaction
        run: python docs/flora-runtime/lloyds-financials/browser.py "$RUNNER_TEMP/lloyds-financial-browser"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flora-enterprise-economics-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/lloyds-financial-browser/*.jpg
            ${{ runner.temp }}/ceo-intelligence-scope.json
            ${{ runner.temp }}/ceo-intelligence-browser/*.json
            ${{ runner.temp }}/ceo-intelligence-browser/*.jpg
            ${{ runner.temp }}/v3-scope.json
            ${{ runner.temp }}/v3-browser/*.json
            ${{ runner.temp }}/v3-browser/*.jpg
            ${{ runner.temp }}/experience-scope.json
            ${{ runner.temp }}/experience-completion-browser/*.json
            ${{ runner.temp }}/experience-completion-browser/*.jpg
            ${{ runner.temp }}/gold-v2-browser/*.json
            ${{ runner.temp }}/gold-v2-browser/*.jpg
            ${{ runner.temp }}/gold-reconciliation-browser/*.json
            ${{ runner.temp }}/gold-reconciliation-browser/*.jpg
            ${{ runner.temp }}/lloyds-product-browser/*.json
            ${{ runner.temp }}/lloyds-product-browser/*.jpg
            ${{ runner.temp }}/lloyds-activation-browser/*.json
            ${{ runner.temp }}/lloyds-activation-browser/*.jpg
            ${{ runner.temp }}/canvas-browser/*.json
            ${{ runner.temp }}/canvas-browser/*.jpg
            ${{ runner.temp }}/ceo-browser/*.json
            ${{ runner.temp }}/ceo-browser/*.jpg
            ${{ runner.temp }}/economics-quality.json
            ${{ runner.temp }}/economics-browser/*.json
            ${{ runner.temp }}/economics-browser/*.jpg
            ${{ runner.temp }}/living-preview-browser/*.json
            ${{ runner.temp }}/living-preview-browser/*.jpg
            ${{ runner.temp }}/gold-browser/*.json
            ${{ runner.temp }}/gold-browser/*.jpg
          retention-days: 14
