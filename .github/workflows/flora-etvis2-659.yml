name: FLORA ET-VIS-2 interactive enterprise preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'cios/applications/flora/**'
      - 'tests/test_flora_etvis2_659.py'
      - 'tools/research/etvis2*.py'
      - 'tools/ci/flora_etvis2_preview.cjs'
      - 'docs/flora-runtime/et-vis2-659/**'
      - '.github/workflows/flora-etvis2-659.yml'
permissions:
  contents: read
jobs:
  enterprise-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Selection, source lifecycle and unchanged Aviation/Banking contracts
        run: python -m pytest tests/test_flora_etvis2_659.py tests/test_flora_aviation_twin.py tests/test_flora_visual_intelligence.py tests/test_flora_visual_panels_632.py -q
      - name: Original source, artwork and security-owner history
        run: |
          python tools/research/auth2_compatibility.py > "$RUNNER_TEMP/etvis2-owner-quality.json"
          python tools/research/etvis2_quality.py > "$RUNNER_TEMP/etvis2-source-quality.json"
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/etvis2-node" playwright@1.62.1
          "$RUNNER_TEMP/etvis2-node/node_modules/.bin/playwright" install --with-deps chromium
      - name: Actual interactive app, navigation, responsiveness and source withdrawal
        env:
          NODE_PATH: ${{ runner.temp }}/etvis2-node/node_modules
        run: |
          git worktree add --detach "$RUNNER_TEMP/etvis2-before" fbac4c37910ed07b2baa516e1a5c8d7f329086de
          python tools/research/etvis2_proof.py --output "$RUNNER_TEMP/etvis2-proof" --baseline-root "$RUNNER_TEMP/etvis2-before"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flora-etvis2-proof-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/etvis2-owner-quality.json
            ${{ runner.temp }}/etvis2-source-quality.json
            ${{ runner.temp }}/etvis2-proof/Proof.json
            ${{ runner.temp }}/etvis2-proof/Browser-Checks.json
            ${{ runner.temp }}/etvis2-proof/*.jpg
          retention-days: 14
