uestion</text><text x="385" y="455" class="small">× closes to selected factor</text><text x="1060" y="130" font-size="18">Native state, same screen</text><text x="1060" y="170" class="small">?factor=…#insight</text><text x="1060" y="210" class="small">Keyboard / touch / no JS</text><text x="1060" y="250" class="small">One optional source disclosure</text><text x="1060" y="300" class="small">Phone: portrait companion</text><text x="1060" y="345" class="small">Political: phone (23%, 15%)</text><text x="1060" y="379" class="small">Economic: phone (77%, 15%)</text><text x="1060" y="413" class="small">Social: phone (23%, 36%)</text><text x="1060" y="447" class="small">Technological: phone (77%, 36%)</text><text x="1060" y="481" class="small">Legal: phone (23%, 89%)</text><text x="1060" y="515" class="small">Environmental: phone (77%, 89%)</text><text x="1060" y="615" class="small">All factors remain unobscured.</text><text x="1060" y="650" class="small">Country is not legal applicability.</text></svg>