<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" width="720" height="1000">
<title>A conceptual airline value system</title><desc>Route planning above a layered airport, aircraft stands and engineering hangar. An editorial illustration, not real premises, supplier contracts, aircraft quantity or route geography.</desc>
